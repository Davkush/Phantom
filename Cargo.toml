[workspace]
members = [
    "phantom-core",
    "phantom-node",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
argon2 = "0.5"
password-hash = "0.5"
blake3 = "1.5"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
pqcrypto-kyber = "0.8"
pqcrypto-dilithium = "0.5"
x25519-dalek = "2.0"
ed25519-dalek = "2.0"
chacha20poly1305 = "0.10"
plonky2 = "=0.2.2"
